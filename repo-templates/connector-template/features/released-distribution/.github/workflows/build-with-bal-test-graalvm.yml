name: GraalVM Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  call_workflow:
    name: Run GraalVM Build Workflow
    if: ${{ github.repository_owner == 'ballerina-platform' }}
    uses: ballerina-platform/ballerina-library/.github/workflows/build-with-bal-test-graalvm-connector-template.yml@main
    with:
      additional-build-flags: >-
        -x :{{MODULE_NAME_CC}}-examples:build
        # {{#COMPILER_PLUGIN}}
        -x :{{MODULE_NAME_CC}}-compiler-plugin-tests:test
        # {{/COMPILER_PLUGIN}}
