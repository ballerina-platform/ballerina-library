name: Security Scan

on:
  workflow_call:
    inputs:
      additional-build-flags:
        required: false
        type: string
        default: ""
      scan-path:
        description: "Path to the main Ballerina package to run 'bal scan' against"
        required: false
        type: string
        default: "ballerina"
      additional-scan-paths:
        description: "Comma-separated list of additional Ballerina package paths to scan with 'bal scan', beyond scan-path and any examples/*/ packages found automatically"
        required: false
        type: string
        default: ""
      scan-examples:
        description: "Run 'bal scan' on the packages under examples/"
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    if: github.repository_owner == 'ballerina-platform'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve Java version
        id: resolve-java
        uses: ballerina-platform/ballerina-library/.github/actions/resolve-java-version@main
      - name: Set up JDK ${{ steps.resolve-java.outputs.java-version }}
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: ${{ steps.resolve-java.outputs.java-version }}

      - name: Build with Gradle
        env:
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
          ADDITIONAL_BUILD_FLAGS: ${{ inputs.additional-build-flags }}
        run: |
          IFS=' ' read -ra BUILD_FLAGS <<< "${ADDITIONAL_BUILD_FLAGS//$'\n'/ }"
          ./gradlew build -x test "${BUILD_FLAGS[@]}"

      # Trivy needs ballerina/lib to exist in the artifact; the placeholder must not be a dotfile, which upload-artifact drops.
      - name: Ensure build output is never empty
        run: |
          mkdir -p ballerina/lib
          if [ -z "$(find ballerina/lib -type f 2>/dev/null)" ]; then
            touch ballerina/lib/artifact-placeholder
          fi

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          # The Ballerina.toml/CompilerPlugin.toml the build regenerated for the current
          # version: the committed copies point at the last release's jar names, so the
          # bal-scan job cannot resolve the freshly built (-SNAPSHOT) jars without them.
          path: |
            ballerina/lib/**
            **/build/libs/*.jar
            ballerina/Ballerina.toml
            ballerina/CompilerPlugin.toml
          if-no-files-found: warn
          retention-days: 1
          include-hidden-files: true

  trivy-scan:
    name: Trivy Vulnerability Scan
    needs: build
    runs-on: ubuntu-22.04
    if: github.repository_owner == 'ballerina-platform'
    steps:
      # Checked out so a repo-root .trivyignore is picked up.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db
        with:
          scan-type: "rootfs"
          scan-ref: "${{ github.workspace }}/ballerina/lib"
          format: "table"
          timeout: "10m0s"
          exit-code: "1"
          scanners: "vuln"
          cache-dir: "/tmp/trivy-cache"

  bal-scan:
    name: Ballerina Static Code Analysis
    needs: build
    runs-on: ubuntu-22.04
    if: github.repository_owner == 'ballerina-platform'
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Resolve Ballerina version
        id: resolve-bal
        uses: ballerina-platform/ballerina-library/.github/actions/resolve-java-version@main

      - name: Resolve bal scan version
        id: resolve-scan
        uses: ballerina-platform/ballerina-library/.github/actions/resolve-bal-scan-version@main
        with:
          lang-version: ${{ steps.resolve-bal.outputs.lang-version }}
          target-branch: ${{ github.ref_name }}
          default-branch: ${{ github.event.repository.default_branch }}
          # A caller can add a `scan-with-branch-version` boolean workflow_dispatch input to opt out of latest.
          use-latest: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.scan-with-branch-version != 'true' }}

      - name: Set up Ballerina
        id: setup-ballerina
        if: steps.resolve-scan.outputs.supported == 'true'
        uses: ballerina-platform/setup-ballerina@v1.1.5
        with:
          version: ${{ steps.resolve-scan.outputs.version }}

      - name: Scan library
        if: steps.resolve-scan.outputs.supported == 'true'
        uses: ballerina-platform/ballerina-library/.github/actions/scan-ballerina@main
        with:
          paths: |
            ${{ inputs.scan-path }}
            ${{ inputs.additional-scan-paths }}
          category: bal-scan-library
          fail-on-severity: medium

      # Runs even when the library gate fails, so examples findings are still reported.
      - name: Scan examples
        if: ${{ !cancelled() && inputs.scan-examples && steps.setup-ballerina.outcome == 'success' }}
        uses: ballerina-platform/ballerina-library/.github/actions/scan-ballerina@main
        with:
          paths: examples
          category: bal-scan-examples
          fail-on-severity: medium
