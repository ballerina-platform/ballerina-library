name: Security Scan

on:
  workflow_call:
    inputs:
      additional-build-flags:
        required: false
        type: string
        default: ""
      scan-path:
        description: "Path to the main Ballerina package to run 'bal scan' against"
        required: false
        type: string
        default: "ballerina"
      additional-scan-paths:
        description: "Comma-separated list of additional Ballerina package paths to scan with 'bal scan', beyond scan-path and any examples/*/ packages found automatically"
        required: false
        type: string
        default: ""
      scan-examples:
        description: "Run 'bal scan' on the packages under examples/"
        required: false
        type: boolean
        default: true
      scan-exclude-tests:
        description: "Drop 'bal scan' findings in tests/ and modules/*/tests/"
        required: false
        type: boolean
        default: true
      scan-artifacts:
        description: "Save the merged 'bal scan' SARIF file as a workflow artifact"
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    if: github.repository_owner == 'ballerina-platform'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve Java version
        id: resolve-java
        uses: ballerina-platform/ballerina-library/.github/actions/resolve-java-version@main
      - name: Set up JDK ${{ steps.resolve-java.outputs.java-version }}
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: ${{ steps.resolve-java.outputs.java-version }}

      - name: Build with Gradle
        env:
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
          ADDITIONAL_BUILD_FLAGS: ${{ inputs.additional-build-flags }}
        run: |
          IFS=' ' read -ra BUILD_FLAGS <<< "${ADDITIONAL_BUILD_FLAGS//$'\n'/ }"
          ./gradlew build -x test "${BUILD_FLAGS[@]}"

      # Trivy needs ballerina/lib to exist in the artifact; the placeholder must not be a dotfile, which upload-artifact drops.
      - name: Ensure build output is never empty
        run: |
          mkdir -p ballerina/lib
          if [ -z "$(find ballerina/lib -type f 2>/dev/null)" ]; then
            touch ballerina/lib/artifact-placeholder
          fi

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            ballerina/lib/**
            **/build/libs/*.jar
            ballerina/Ballerina.toml
            ballerina/CompilerPlugin.toml
          if-no-files-found: warn
          retention-days: 1
          include-hidden-files: true

  trivy-scan:
    name: Trivy Vulnerability Scan
    needs: build
    runs-on: ubuntu-22.04
    if: github.repository_owner == 'ballerina-platform'
    steps:
      # Checked out so a repo-root .trivyignore is picked up.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.76.1"
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          bin_dir="${HOME}/.local/bin/trivy-bin"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfL "${base}/trivy_${TRIVY_VERSION}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          mkdir -p "${bin_dir}"
          tar -xzf "${tarball}" -C "${bin_dir}" trivy
          rm "${tarball}"
          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db
        with:
          skip-setup-trivy: true
          scan-type: "rootfs"
          scan-ref: "${{ github.workspace }}/ballerina/lib"
          format: "table"
          timeout: "10m0s"
          exit-code: "1"
          scanners: "vuln"
          cache-dir: "/tmp/trivy-cache"

  bal-scan:
    name: Ballerina Static Code Analysis
    needs: build
    runs-on: ubuntu-22.04
    if: github.repository_owner == 'ballerina-platform'
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Resolve Ballerina version
        id: resolve-bal
        uses: ballerina-platform/ballerina-library/.github/actions/resolve-java-version@main

      - name: Resolve bal scan version
        id: resolve-scan
        uses: ballerina-platform/ballerina-library/.github/actions/resolve-bal-scan-version@main
        with:
          lang-version: ${{ steps.resolve-bal.outputs.lang-version }}
          target-branch: ${{ github.ref_name }}
          default-branch: ${{ github.event.repository.default_branch }}
          # A caller can add a `scan-with-branch-version` boolean workflow_dispatch input to opt out of latest.
          use-latest: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.scan-with-branch-version != 'true' }}

      - name: Set up Ballerina
        id: setup-ballerina
        if: steps.resolve-scan.outputs.supported == 'true'
        uses: ballerina-platform/setup-ballerina@v1.1.5
        with:
          version: ${{ steps.resolve-scan.outputs.version }}

      # scan-ballerina fails on missing paths and scans the whole repository when given none.
      - name: Resolve scan paths
        id: scan-paths
        if: steps.resolve-scan.outputs.supported == 'true'
        env:
          SCAN_PATH: ${{ inputs.scan-path }}
          ADDITIONAL_SCAN_PATHS: ${{ inputs.additional-scan-paths }}
        run: |
          PATHS=""
          while IFS= read -r p; do
            p="$(printf '%s' "$p" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -n "$p" ] || continue
            if [ -d "$p" ]; then
              PATHS+="$p"$'\n'
            else
              echo "::warning::Skipping scan path '$p': it is not a directory in this repository."
            fi
          done < <(printf '%s\n%s\n' "$SCAN_PATH" "$ADDITIONAL_SCAN_PATHS" | tr ',' '\n')
          {
            echo "paths<<SCAN_PATHS_EOF"
            printf '%s' "$PATHS"
            echo "SCAN_PATHS_EOF"
            echo "has-paths=$([ -n "$PATHS" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Scan library
        if: steps.scan-paths.outputs.has-paths == 'true'
        uses: ballerina-platform/scan-ballerina@v0
        with:
          platforms: github-code-scanning
          ballerina-version: ${{ steps.resolve-scan.outputs.version }}
          paths: ${{ steps.scan-paths.outputs.paths }}
          category: bal-scan-library
          fail-on-severity: medium
          exclude-tests: ${{ inputs.scan-exclude-tests }}
          artifacts: ${{ inputs.scan-artifacts }}

      # Runs even when the library gate fails, so examples findings are still reported.
      - name: Scan examples
        if: ${{ !cancelled() && inputs.scan-examples && steps.setup-ballerina.outcome == 'success' && hashFiles('examples/**') != '' }}
        uses: ballerina-platform/scan-ballerina@v0
        with:
          platforms: github-code-scanning
          ballerina-version: ${{ steps.resolve-scan.outputs.version }}
          paths: examples
          category: bal-scan-examples
          fail-on-severity: medium
          exclude-tests: ${{ inputs.scan-exclude-tests }}
          artifacts: ${{ inputs.scan-artifacts }}
