name: Security Scan

on:
  workflow_call:
    inputs:
      additional-build-flags:
        required: false
        type: string
        default: ""
      scan-path:
        description: "Path to the Ballerina package to run 'bal scan' against"
        required: false
        type: string
        default: "ballerina"

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    if: github.repository_owner == 'ballerina-platform'
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: 21.0.3

      - name: Build with Gradle
        env:
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build -x test ${{ inputs.additional-build-flags }}

      # Shared with the trivy-scan and bal-scan jobs below so the package is only built
      # once: ballerina/lib is what Trivy scans, and **/build/libs/*.jar covers every
      # subproject's packaged jar (e.g. a module's own native implementation jar), which
      # bal scan needs to resolve the platform dependencies declared in Ballerina.toml
      # in order to compile the package.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            ballerina/lib/**
            **/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 1

  trivy-scan:
    name: Trivy Vulnerability Scan
    needs: build
    runs-on: ubuntu-22.04
    if: github.repository_owner == 'ballerina-platform'
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      # Modules with no platform-level third-party dependencies (e.g. no
      # externalJars) produce an empty ballerina/lib, and upload-artifact/
      # download-artifact don't preserve empty directories -- so it may not exist
      # at all here even though the build job created it. Trivy fails hard on a
      # missing path (unlike an empty existing one), so recreate it defensively.
      - name: Create lib directory if not exists
        run: mkdir -p ballerina/lib

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db
        with:
          scan-type: "rootfs"
          scan-ref: "${{ github.workspace }}/ballerina/lib"
          format: "table"
          timeout: "10m0s"
          exit-code: "1"
          scanners: "vuln"
          cache-dir: "/tmp/trivy-cache"

  bal-scan:
    name: Ballerina Static Code Analysis
    needs: build
    runs-on: ubuntu-22.04
    if: github.repository_owner == 'ballerina-platform'
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v3

      # Overlays the jars built once by the build job onto this fresh checkout, at the
      # same relative paths Ballerina.toml expects (e.g. ballerina/lib/*.jar,
      # native/build/libs/*.jar), so bal scan can compile without rebuilding.
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Get Ballerina Version
        run: |
          BAL_VERSION=$(grep -w 'ballerinaLangVersion' gradle.properties | cut -d= -f2 | rev | cut --complement -d- -f1 | rev)
          if [ -z "$BAL_VERSION" ]; then
            BAL_VERSION="latest"
          fi
          echo "BAL_VERSION=$BAL_VERSION" >> $GITHUB_ENV

      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v1.1.3
        with:
          version: ${{ env.BAL_VERSION }}

      - name: Pull the bal scan tool
        run: bal tool pull scan

      # --format=sarif and the default (JSON) report are mutually exclusive per
      # invocation, so we standardize on SARIF alone: it's what both the code
      # scanning upload and the vulnerability gate below need, and --scan-report
      # still gives us the HTML report in the same run.
      - name: Run bal scan
        working-directory: ${{ inputs.scan-path }}
        run: bal scan --format=sarif --scan-report

      # bal scan always exits 0 even if it fails to produce a report, so an
      # empty/missing SARIF must be treated as an error rather than silently
      # uploaded as "no findings" (which would read as "everything fixed").
      - name: Verify the SARIF was produced
        working-directory: ${{ inputs.scan-path }}
        run: |
          f=target/report/scan_results.sarif
          test -f "$f" || { echo "::error::$f was not produced"; exit 1; }
          jq -e '.runs[0]' "$f" > /dev/null || { echo "::error::$f has no runs"; exit 1; }

      - name: Upload bal scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bal-scan-report
          path: ${{ inputs.scan-path }}/target/report
          retention-days: 30
          if-no-files-found: ignore

      # bal scan reports artifactLocation.uri relative to the package directory it
      # ran in (e.g. "abstract_cache.bal"), not the repository root (the real path
      # is "ballerina/abstract_cache.bal"). GitHub resolves SARIF locations against
      # the repo root and silently drops any result it can't map to a real file, so
      # without this the upload registers as an analysis but produces zero visible
      # alerts. Rewriting a copy for the upload keeps the original untouched for the
      # artifact and the gate below.
      - name: Rewrite SARIF paths relative to the repository root
        working-directory: ${{ inputs.scan-path }}
        run: |
          jq --arg prefix "${{ inputs.scan-path }}/" '
            (.runs[].results[].locations[].physicalLocation.artifactLocation.uri) |= ($prefix + .)
          ' target/report/scan_results.sarif > target/report/scan_results_github.sarif

      # Publishes findings to the repo's Security > Code scanning tab, where they're
      # tracked and auto-closed across runs. Non-blocking: some caller repos may not
      # grant security-events: write to the token (permissions here are a ceiling, not
      # a guarantee), and that shouldn't fail the scan itself -- only the gate below does.
      - name: Upload SARIF to GitHub code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ inputs.scan-path }}/target/report/scan_results_github.sarif
          category: bal-scan

      # bal scan derives SARIF `level` from rule kind, not true severity:
      # VULNERABILITY rules -> warning, CODE_SMELL rules -> note, and nothing is ever
      # `error` (no rule is classified BUG yet). Fail only on `warning`; code smells
      # are visible in the uploaded report but don't fail the job, since existing
      # style debt shouldn't break nightly runs across the org.
      - name: Fail the job if vulnerabilities are found
        working-directory: ${{ inputs.scan-path }}
        run: |
          VULN_COUNT=$(jq '[.runs[].results[] | select(.level == "warning")] | length' target/report/scan_results.sarif)
          SMELL_COUNT=$(jq '[.runs[].results[] | select(.level == "note")] | length' target/report/scan_results.sarif)
          echo "bal scan found $VULN_COUNT vulnerability finding(s) and $SMELL_COUNT code smell finding(s). See the bal-scan-report artifact for details."
          if [ "$VULN_COUNT" -gt 0 ]; then
            jq '[.runs[].results[] | select(.level == "warning")]' target/report/scan_results.sarif
            echo "::error::bal scan found $VULN_COUNT vulnerability finding(s). Failing the job."
            exit 1
          fi
