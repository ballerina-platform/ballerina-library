name: Apply Library Repo Templates and Create PR

on:
  workflow_dispatch:
    inputs:
      template_type:
        description: 'Select the type of template to apply to the target repository.'
        default: 'Generated Connector Template (Standard)'
        type: choice
        options:
          - Generated Connector Template (Standard)
          - Library Template
          - Library Template (Native)
          - Connector Template
      target_repo:
        description: 'The repository where the selected template will be applied.'
        required: true
      module_name:
        description: 'The module name as defined in the Ballerina.toml file.'
        required: true
      ballerina_version:
        description: 'The Ballerina version that the library should be compatible with.'
        required: true
      module_version:
        description: 'The version number of the library module.'
        required: true
        default: '0.1.0'
      target_branch:
        description: 'The branch in the target repository where changes will be applied.'
        required: false
        default: 'main'
      library_name:
        description: 'A descriptive name for the library, used in the documentation. If not provided, the module name will be used instead.'
        required: false
        default: ''
      code_owners:
        description: 'The CODEOWNERS of the repository'
        required: true
        default: ''
      distribution:
        description: 'Connector Template only: build against a released Ballerina distribution (connector workflows) or the timestamped lang version (stdlib workflows and release pipeline).'
        default: 'Released'
        type: choice
        options:
          - Released
          - Timestamped
      compiler_plugin:
        description: 'Library Template (Native) and Connector Template only: add a compiler plugin module.'
        default: false
        type: boolean

jobs:
  apply_templates:
    runs-on: ubuntu-22.04
    steps:
      - name: Print Inputs
        run: |
          echo "Template Type: ${{ github.event.inputs.template_type }}"
          echo "Target Repository: ${{ github.event.inputs.target_repo }}"
          echo "Module Name: ${{ github.event.inputs.module_name }}"
          echo "Ballerina Version: ${{ github.event.inputs.ballerina_version }}"
          echo "Module Version: ${{ github.event.inputs.module_version }}"
          echo "Target Branch: ${{ github.event.inputs.target_branch }}"
          echo "Library Name: ${{ github.event.inputs.library_name }}"
          echo "Code Owners: ${{ github.event.inputs.code_owners }}"
          echo "Distribution: ${{ github.event.inputs.distribution }}"
          echo "Compiler Plugin: ${{ github.event.inputs.compiler_plugin }}"

      - name: Resolve template
        env:
          TEMPLATE_TYPE: ${{ github.event.inputs.template_type }}
          DISTRIBUTION: ${{ github.event.inputs.distribution }}
          COMPILER_PLUGIN: ${{ github.event.inputs.compiler_plugin }}
        run: |
          FEATURES=""
          case "$TEMPLATE_TYPE" in
            "Generated Connector Template (Standard)") TEMPLATE="generated-connector-template" ;;
            "Library Template") TEMPLATE="library-template" ;;
            "Library Template (Native)") TEMPLATE="library-native-template" ;;
            "Connector Template")
              TEMPLATE="connector-template"
              if [[ "$DISTRIBUTION" == "Timestamped" ]]; then
                FEATURES="timestamped-distribution"
              else
                FEATURES="released-distribution"
              fi
              ;;
            *) echo "::error::Unknown template type: $TEMPLATE_TYPE"; exit 1 ;;
          esac
          if [[ "$COMPILER_PLUGIN" == "true" ]]; then
            if [[ "$TEMPLATE" != "library-native-template" && "$TEMPLATE" != "connector-template" ]]; then
              echo "::error::The compiler plugin is supported only by the Library Template (Native) and the Connector Template"
              exit 1
            fi
            FEATURES="${FEATURES:+$FEATURES,}compiler-plugin"
          fi
          echo "TEMPLATE=$TEMPLATE" >> $GITHUB_ENV
          echo "FEATURES=$FEATURES" >> $GITHUB_ENV
          echo "Template: $TEMPLATE, Features: $FEATURES"

      - name: Checkout template repository
        uses: actions/checkout@v3
        with:
          path: template-repo

      - name: Checkout target repository
        uses: actions/checkout@v3
        with:
          repository: ballerina-platform/${{ github.event.inputs.target_repo }}
          path: target-repo
          token: ${{ secrets.BALLERINA_BOT_TOKEN }}

      - name: Setup Ballerina
        uses: ballerina-platform/setup-ballerina@v1.1.5
        with:
          version: latest

      - name: Apply templates and replace placeholders
        run: |
          bal run template-repo/repo-templates/scripts/apply_template.bal -- \
            "template-repo/repo-templates/$TEMPLATE" target-repo \
            "${{ github.event.inputs.module_name }}" "${{ github.event.inputs.target_repo }}" \
            "${{ github.event.inputs.module_version }}" "${{ github.event.inputs.ballerina_version }}" \
            --name="${{ github.event.inputs.library_name }}" --codeOwners="${{ github.event.inputs.code_owners }}" \
            --features="$FEATURES"
          cd target-repo
          git config user.name "ballerina-bot"
          git config user.email "ballerina-bot@ballerina.org"
          git checkout -b apply-templates-${{ github.run_number }}
          git add .
          git commit -m "Apply library repo template"
          git push origin apply-templates-${{ github.run_number }}

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.BALLERINA_BOT_TOKEN }}
        run: |
          gh pr create \
            --repo ballerina-platform/${{ github.event.inputs.target_repo }} \
            --base ${{ github.event.inputs.target_branch }} \
            --head apply-templates-${{ github.run_number }} \
            --title "Add ${{ github.event.inputs.template_type }}" \
            --body "This PR applies ${{ github.event.inputs.template_type }} template to this repository."
