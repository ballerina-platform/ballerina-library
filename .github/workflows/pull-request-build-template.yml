name: Pull Request Build

on:
  workflow_call:
    inputs:
      additional-ubuntu-build-flags:
        required: false
        type: string
        default: ""
      additional-ubuntu-test-flags:
        required: false
        type: string
        default: ""
      additional-windows-build-flags:
        required: false
        type: string
        default: ""
      additional-windows-test-flags:
        required: false
        type: string
        default: ""
      scan-path:
        description: "Path to the main Ballerina package to run 'bal scan' against"
        required: false
        type: string
        default: "ballerina"
      additional-scan-paths:
        description: "Comma-separated list of additional Ballerina package paths to scan with 'bal scan', beyond scan-path and any examples/*/ packages found automatically"
        required: false
        type: string
        default: ""
    secrets:
      CODECOV_TOKEN:
        required: false


# The `build` and `test` commands ran separately as the Ballerina Gradle plugin does not support skipping test groups
# when the `gradlew build` is used. It is only supported for `gradlew test`.
jobs:
    ubuntu-build:
        name: Build on Ubuntu
        runs-on: ubuntu-22.04
        concurrency:
          group: ${{ github.head_ref }}-ubuntu-build
          cancel-in-progress: true
        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v3

            -   name: Resolve Java version
                id: resolve-java
                uses: ballerina-platform/ballerina-library/.github/actions/resolve-java-version@main

            -   name: Set up JDK ${{ steps.resolve-java.outputs.java-version }}
                uses: actions/setup-java@v3
                with:
                    distribution: 'temurin'
                    java-version: ${{ steps.resolve-java.outputs.java-version }}

            - name: Set ENV Variables
              run: |
                echo -e '${{ toJson(secrets) }}' | jq -r 'to_entries[] | .key + "=" + .value' >> $GITHUB_ENV

            -   name: Build the Package
                env:
                    packageUser: ${{ github.actor }}
                    packagePAT: ${{ secrets.GITHUB_TOKEN }}
                run: |
                  ./gradlew build -x test ${{ inputs.additional-ubuntu-build-flags }}
                  ./gradlew test ${{ inputs.additional-ubuntu-test-flags }}

            - name: Generate CodeCov Report
              uses: codecov/codecov-action@v5
              with:
                token: ${{ secrets.CODECOV_TOKEN }}
                slug: ballerina-platform/${{ github.event.repository.name }}

    windows-build:
        name: Build on Windows
        runs-on: windows-latest
        concurrency:
          group: ${{ github.head_ref }}-windows-build
          cancel-in-progress: true
        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v3

            -   name: Resolve Java version
                id: resolve-java
                uses: ballerina-platform/ballerina-library/.github/actions/resolve-java-version@main

            -   name: Set up JDK ${{ steps.resolve-java.outputs.java-version }}
                uses: actions/setup-java@v3
                with:
                    distribution: 'temurin'
                    java-version: ${{ steps.resolve-java.outputs.java-version }}

            - name: Set ENV Variables
              run: |
                echo '${{ toJson(secrets) }}' | jq -r 'to_entries[] | .key + "=" + .value' | Out-File -FilePath $env:GITHUB_ENV -Append

            -   name: Build the Project
                env:
                    packageUser: ${{ github.actor }}
                    packagePAT: ${{ secrets.GITHUB_TOKEN }}
                    JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
                run: |
                  ./gradlew.bat build -x test ${{ inputs.additional-windows-build-flags }}
                  ./gradlew.bat test ${{ inputs.additional-windows-test-flags }}

    # ubuntu-build/windows-build above stay exactly as they were pre-Java25 (single job, no
    # matrix, fixed check name) so existing required-status-check config in consuming repos keeps
    # working unchanged. Extra JDK-tier compatibility legs (only added on the default branch while
    # it isn't yet on the newest tier) run here instead, as separate matrixed jobs nothing depends
    # on as a required check.
    determine-extra-matrix:
        name: Determine Extra Java/Lang Version Matrix
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v3

            -   name: Resolve current Java version
                id: current
                uses: ballerina-platform/ballerina-library/.github/actions/resolve-java-version@main

            -   name: Determine matrix
                id: set-matrix
                run: |
                  IS_DEFAULT_BRANCH=false
                  if [ "${{ github.base_ref }}" = "${{ github.event.repository.default_branch }}" ]; then
                    IS_DEFAULT_BRANCH=true
                  fi

                  # Each JDK tier's entry is the first Ballerina lang version that requires it -
                  # used to test a tier above the module's current one against a real distribution
                  # for that tier, not just the current distribution rebuilt under a newer JDK.
                  JAVA_TIERS=(11 17 21 25)
                  DEFAULT_LANG_VERSIONS=("" "2201.8.0" "2201.11.0" "2201.14.0-20260911-112100-0f421c6f")

                  CURRENT_JAVA="${{ steps.current.outputs.java-version }}"
                  CURRENT_INDEX=0
                  for i in "${!JAVA_TIERS[@]}"; do
                    if [ "${JAVA_TIERS[$i]}" = "$CURRENT_JAVA" ]; then
                      CURRENT_INDEX=$i
                    fi
                  done
                  LAST_INDEX=$(( ${#JAVA_TIERS[@]} - 1 ))

                  LEGS=""
                  if [ "$IS_DEFAULT_BRANCH" = "true" ]; then
                    # every tier strictly above the module's current one, up through the newest tier
                    # (seq prints nothing, without erroring, when current is already the newest)
                    for i in $(seq $(( CURRENT_INDEX + 1 )) "$LAST_INDEX"); do
                      JV="${JAVA_TIERS[$i]}"
                      LEG="{\"java-version\":\"$JV\",\"lang-version\":\"${DEFAULT_LANG_VERSIONS[$i]}\"}"
                      LEGS="${LEGS:+$LEGS,}$LEG"
                    done
                  fi
                  echo "matrix=[$LEGS]" >> "$GITHUB_OUTPUT"

    ubuntu-build-extra:
        name: Build on Ubuntu (Extra JDK Compatibility)
        needs: determine-extra-matrix
        runs-on: ubuntu-22.04
        if: ${{ needs.determine-extra-matrix.outputs.matrix != '[]' }}
        strategy:
          fail-fast: false
          matrix:
            include: ${{ fromJSON(needs.determine-extra-matrix.outputs.matrix) }}
        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v3

            -   name: Set up JDK ${{ matrix.java-version }}
                uses: actions/setup-java@v3
                with:
                    distribution: 'temurin'
                    java-version: ${{ matrix.java-version }}

            -   name: Override Ballerina Lang version
                run: perl -pi -e "s/^\s*ballerinaLangVersion=.*/ballerinaLangVersion=${{ matrix.lang-version }}/" gradle.properties

            - name: Set ENV Variables
              run: |
                echo -e '${{ toJson(secrets) }}' | jq -r 'to_entries[] | .key + "=" + .value' >> $GITHUB_ENV

            -   name: Build the Package
                env:
                    packageUser: ${{ github.actor }}
                    packagePAT: ${{ secrets.GITHUB_TOKEN }}
                run: |
                  ./gradlew build -x test ${{ inputs.additional-ubuntu-build-flags }}
                  ./gradlew test ${{ inputs.additional-ubuntu-test-flags }}

    windows-build-extra:
        name: Build on Windows (Extra JDK Compatibility)
        needs: determine-extra-matrix
        runs-on: windows-latest
        if: ${{ needs.determine-extra-matrix.outputs.matrix != '[]' }}
        strategy:
          fail-fast: false
          matrix:
            include: ${{ fromJSON(needs.determine-extra-matrix.outputs.matrix) }}
        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v3

            -   name: Set up JDK ${{ matrix.java-version }}
                uses: actions/setup-java@v3
                with:
                    distribution: 'temurin'
                    java-version: ${{ matrix.java-version }}

            -   name: Override Ballerina Lang version
                run: perl -pi -e "s/^\s*ballerinaLangVersion=.*/ballerinaLangVersion=${{ matrix.lang-version }}/" gradle.properties

            - name: Set ENV Variables
              run: |
                echo '${{ toJson(secrets) }}' | jq -r 'to_entries[] | .key + "=" + .value' | Out-File -FilePath $env:GITHUB_ENV -Append

            -   name: Build the Project
                env:
                    packageUser: ${{ github.actor }}
                    packagePAT: ${{ secrets.GITHUB_TOKEN }}
                    JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
                run: |
                  ./gradlew.bat build -x test ${{ inputs.additional-windows-build-flags }}
                  ./gradlew.bat test ${{ inputs.additional-windows-test-flags }}

    # Informational: findings never fail this job. It builds on its own instead of waiting
    # for ubuntu-build, so results land early, and uploads SARIF to code scanning, which makes
    # GitHub annotate the findings inline on the PR diff. The nightly Security Scan is what gates.
    # No job-level `permissions`: callers don't grant any, and a nested job requesting more than
    # the caller's token allows would stop the whole PR workflow from starting.
    bal-scan:
        name: Ballerina Static Code Analysis
        runs-on: ubuntu-22.04
        concurrency:
          group: ${{ github.head_ref }}-bal-scan
          cancel-in-progress: true
        steps:
            # Inline annotations only land on lines the PR changes, so a PR touching no Ballerina
            # source can't get any and skips the build and scan entirely.
            -   name: Check for Ballerina changes
                id: changes
                env:
                    GH_TOKEN: ${{ github.token }}
                    PR_NUMBER: ${{ github.event.pull_request.number }}
                    CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
                run: |
                  FILES="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
                  LISTED="$(printf '%s' "$FILES" | grep -c '' || true)"
                  # The files API caps at 3000 entries; scan anyway when the list is incomplete.
                  if [ "$LISTED" -lt "$CHANGED_FILES" ] || printf '%s\n' "$FILES" | grep -qE '(\.bal|(^|/)Ballerina\.toml)$'; then
                    echo "bal-changed=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "bal-changed=false" >> "$GITHUB_OUTPUT"
                    echo "bal scan skipped: this PR changes no Ballerina source files." >> "$GITHUB_STEP_SUMMARY"
                    echo "::notice::bal scan skipped: this PR changes no Ballerina source files"
                  fi

            -   name: Checkout Repository
                if: steps.changes.outputs.bal-changed == 'true'
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Resolve Java version
                id: resolve-java
                if: steps.changes.outputs.bal-changed == 'true'
                uses: ballerina-platform/ballerina-library/.github/actions/resolve-java-version@main

            -   name: Resolve bal scan version
                id: resolve-scan
                if: steps.changes.outputs.bal-changed == 'true'
                uses: ballerina-platform/ballerina-library/.github/actions/resolve-bal-scan-version@main
                with:
                    lang-version: ${{ steps.resolve-java.outputs.lang-version }}
                    target-branch: ${{ github.base_ref }}
                    default-branch: ${{ github.event.repository.default_branch }}

            -   name: Set up JDK ${{ steps.resolve-java.outputs.java-version }}
                if: steps.resolve-scan.outputs.supported == 'true'
                uses: actions/setup-java@v6
                with:
                    distribution: 'temurin'
                    java-version: ${{ steps.resolve-java.outputs.java-version }}

            # bal scan needs the jars the Gradle build produces to resolve the platform
            # dependencies in Ballerina.toml. `check` (checkstyle, spotbugs) is skipped since
            # ubuntu-build already runs it and the scan doesn't need its output.
            -   name: Build the Package
                if: steps.resolve-scan.outputs.supported == 'true'
                env:
                    packageUser: ${{ github.actor }}
                    packagePAT: ${{ secrets.GITHUB_TOKEN }}
                    ADDITIONAL_BUILD_FLAGS: ${{ inputs.additional-ubuntu-build-flags }}
                run: |
                  IFS=' ' read -ra BUILD_FLAGS <<< "${ADDITIONAL_BUILD_FLAGS//$'\n'/ }"
                  ./gradlew build -x test -x check "${BUILD_FLAGS[@]}"

            -   name: Discover Ballerina packages to scan
                if: steps.resolve-scan.outputs.supported == 'true'
                env:
                    SCAN_PATH: ${{ inputs.scan-path }}
                    ADDITIONAL_SCAN_PATHS: ${{ inputs.additional-scan-paths }}
                run: |
                  declare -a LIBRARY_PACKAGES=()
                  [ -d "$SCAN_PATH" ] && LIBRARY_PACKAGES+=("$SCAN_PATH")

                  IFS=',' read -ra EXTRA <<< "${ADDITIONAL_SCAN_PATHS//$'\n'/,}"
                  for p in "${EXTRA[@]}"; do
                    p="$(printf '%s' "$p" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
                    [ -n "$p" ] && LIBRARY_PACKAGES+=("$p")
                  done

                  declare -a EXAMPLE_PACKAGES=()
                  if [ -d "examples" ]; then
                    while IFS= read -r toml; do
                      EXAMPLE_PACKAGES+=("$(dirname "$toml")")
                    done < <(find examples \( -path '*/target/*' -o -path '*/.git/*' -o -path '*/build/*' \) -prune -o -iname 'Ballerina.toml' -print | sort)
                  fi

                  printf '%s\n' "${LIBRARY_PACKAGES[@]}" > library-packages.txt
                  printf '%s\n' "${EXAMPLE_PACKAGES[@]}" > example-packages.txt
                  echo "Library package(s):"; cat library-packages.txt
                  echo "Example package(s):"; cat example-packages.txt

            -   name: Set up Ballerina
                if: steps.resolve-scan.outputs.supported == 'true'
                uses: ballerina-platform/setup-ballerina@v1.1.5
                with:
                    version: ${{ steps.resolve-scan.outputs.version }}

            -   name: Pull the bal scan tool
                if: steps.resolve-scan.outputs.supported == 'true'
                run: bal tool pull scan

            # A package that fails to scan is reported and skipped rather than failing the job.
            -   name: Run bal scan
                if: steps.resolve-scan.outputs.supported == 'true'
                run: |
                  for list in library-packages.txt example-packages.txt; do
                    while IFS= read -r pkg; do
                      [ -z "$pkg" ] && continue
                      echo "::group::bal scan $pkg"
                      (cd "$pkg" && bal scan --format=sarif) || true
                      f="$pkg/target/report/scan_results.sarif"
                      if [ ! -f "$f" ] || ! jq -e '.runs[0]' "$f" > /dev/null 2>&1; then
                        echo "::warning::bal scan did not produce a report for package '$pkg'"
                      fi
                      echo "::endgroup::"
                    done < "$list"
                  done

            # bal scan reports paths relative to the package, but code scanning resolves them
            # against the repo root and drops results it can't map. Each group is merged into
            # one SARIF run since code scanning rejects multiple runs under one category.
            -   name: Prepare SARIF for code scanning
                if: steps.resolve-scan.outputs.supported == 'true'
                run: |
                  rewrite_group() {
                    local group="$1" list="$2"
                    local tmpdir
                    tmpdir="$(mktemp -d)"
                    while IFS= read -r pkg; do
                      [ -z "$pkg" ] && continue
                      f="$pkg/target/report/scan_results.sarif"
                      { [ -f "$f" ] && jq -e '.runs[0]' "$f" > /dev/null 2>&1; } || continue
                      name="$(echo "$pkg" | tr '/' '_')"
                      jq --arg prefix "$pkg/" '
                        (.runs[].results[]?.locations[]?.physicalLocation.artifactLocation.uri) |= ($prefix + .)
                      ' "$f" > "$tmpdir/$name.sarif"
                    done < "$list"

                    if [ -n "$(ls -A "$tmpdir")" ]; then
                      jq -s '
                        . as $all
                        | {
                            "$schema": $all[0]["$schema"],
                            version: $all[0].version,
                            runs: [{
                              tool: ($all[0].runs[0].tool | .driver.rules = ($all | map(.runs[0].tool.driver.rules[]?) | unique_by(.id))),
                              results: ($all | map(.runs[0].results[]?))
                            }]
                          }
                      ' "$tmpdir"/*.sarif > "bal-scan-$group.sarif"
                    fi
                    rm -rf "$tmpdir"
                  }
                  rewrite_group library library-packages.txt
                  rewrite_group examples example-packages.txt

            # bal-scan-library matches the nightly scan's category, so GitHub compares the PR
            # against the default branch's baseline and comments only on what the PR introduces.
            -   name: Upload library SARIF to code scanning
                id: upload-library
                if: steps.resolve-scan.outputs.supported == 'true' && hashFiles('bal-scan-library.sarif') != ''
                continue-on-error: true
                uses: github/codeql-action/upload-sarif@v4
                with:
                    sarif_file: bal-scan-library.sarif
                    category: bal-scan-library

            -   name: Upload examples SARIF to code scanning
                id: upload-examples
                if: steps.resolve-scan.outputs.supported == 'true' && hashFiles('bal-scan-examples.sarif') != ''
                continue-on-error: true
                uses: github/codeql-action/upload-sarif@v4
                with:
                    sarif_file: bal-scan-examples.sarif
                    category: bal-scan-examples

            -   name: Write scan summary
                if: always() && steps.resolve-scan.outputs.supported == 'true'
                env:
                    LIBRARY_UPLOAD: ${{ steps.upload-library.outcome }}
                    EXAMPLES_UPLOAD: ${{ steps.upload-examples.outcome }}
                run: |
                  summarize_group() {
                    local title="$1" list="$2" upload="$3"
                    local vuln=0 smell=0
                    echo "### $title"
                    echo
                    if [ ! -s "$list" ] || [ -z "$(tr -d '[:space:]' < "$list")" ]; then
                      echo "No packages found."
                      echo
                      return
                    fi
                    echo "| Package | Vulnerabilities | Code smells |"
                    echo "| --- | --- | --- |"
                    while IFS= read -r pkg; do
                      [ -z "$pkg" ] && continue
                      f="$pkg/target/report/scan_results.sarif"
                      if [ ! -f "$f" ] || ! jq -e '.runs[0]' "$f" > /dev/null 2>&1; then
                        echo "| $pkg | _scan did not complete_ | _scan did not complete_ |"
                        continue
                      fi
                      v=$(jq '[.runs[].results[]? | select(.level != "note")] | length' "$f")
                      s=$(jq '[.runs[].results[]? | select(.level == "note")] | length' "$f")
                      echo "| $pkg | $v | $s |"
                      vuln=$((vuln + v))
                      smell=$((smell + s))
                    done < "$list"
                    echo "| **Total** | **$vuln** | **$smell** |"
                    echo
                    if [ "$upload" = "success" ]; then
                      echo "Uploaded to code scanning: findings on lines changed by this PR are annotated inline."
                    else
                      echo "Not uploaded to code scanning, so there are no inline annotations for this group."
                    fi
                    echo
                  }

                  {
                    echo "## bal scan results (informational)"
                    echo
                    summarize_group "Library" library-packages.txt "$LIBRARY_UPLOAD"
                    summarize_group "Examples" example-packages.txt "$EXAMPLES_UPLOAD"
                  } >> "$GITHUB_STEP_SUMMARY"
