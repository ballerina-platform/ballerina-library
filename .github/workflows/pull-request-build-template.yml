name: Pull Request Build

on:
  workflow_call:
    inputs:
      additional-ubuntu-build-flags:
        required: false
        type: string
        default: ""
      additional-ubuntu-test-flags:
        required: false
        type: string
        default: ""
      additional-windows-build-flags:
        required: false
        type: string
        default: ""
      additional-windows-test-flags:
        required: false
        type: string
        default: ""
    secrets:
      CODECOV_TOKEN:
        required: false


# The `build` and `test` commands ran separately as the Ballerina Gradle plugin does not support skipping test groups
# when the `gradlew build` is used. It is only supported for `gradlew test`.
jobs:
    determine-matrix:
        name: Determine Java/Lang Version Matrix
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v3

            -   name: Resolve current Java version
                id: current
                uses: ballerina-platform/ballerina-library/.github/actions/resolve-java-version@dev

            -   name: Determine matrix
                id: set-matrix
                run: |
                  IS_DEFAULT_BRANCH=false
                  if [ "${{ github.base_ref }}" = "${{ github.event.repository.default_branch }}" ]; then
                    IS_DEFAULT_BRANCH=true
                  fi

                  # Each JDK tier's entry is the first Ballerina lang version that requires it -
                  # used to test a tier above the module's current one against a real distribution
                  # for that tier, not just the current distribution rebuilt under a newer JDK.
                  JAVA_TIERS=(11 17 21 25)
                  DEFAULT_LANG_VERSIONS=("" "2201.8.0" "2201.11.0" "2201.14.0")

                  CURRENT_JAVA="${{ steps.current.outputs.java-version }}"
                  CURRENT_INDEX=0
                  for i in "${!JAVA_TIERS[@]}"; do
                    if [ "${JAVA_TIERS[$i]}" = "$CURRENT_JAVA" ]; then
                      CURRENT_INDEX=$i
                    fi
                  done
                  LAST_INDEX=$(( ${#JAVA_TIERS[@]} - 1 ))

                  if [ "$IS_DEFAULT_BRANCH" = "true" ] && [ "$CURRENT_INDEX" -lt "$LAST_INDEX" ]; then
                    # default branch, not yet on the newest JDK tier -> prove every tier from the
                    # module's current one up through the newest tier still works (usually just
                    # [current, 25], but a module several tiers behind gets a leg per tier in between)
                    LEGS=""
                    for i in $(seq "$CURRENT_INDEX" "$LAST_INDEX"); do
                      JV="${JAVA_TIERS[$i]}"
                      if [ "$i" = "$CURRENT_INDEX" ]; then
                        LEG="{\"java-version\":\"$JV\",\"lang-version\":\"\",\"report-coverage\":true}"
                      else
                        LEG="{\"java-version\":\"$JV\",\"lang-version\":\"${DEFAULT_LANG_VERSIONS[$i]}\",\"report-coverage\":false}"
                      fi
                      LEGS="${LEGS:+$LEGS,}$LEG"
                    done
                    MATRIX="[$LEGS]"
                  else
                    # non-default branch, or default branch already on the newest tier -> single leg
                    # matching what's pinned
                    MATRIX="[{\"java-version\":\"$CURRENT_JAVA\",\"lang-version\":\"\",\"report-coverage\":true}]"
                  fi
                  echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

    ubuntu-build:
        name: Build on Ubuntu
        needs: determine-matrix
        runs-on: ubuntu-22.04
        strategy:
          fail-fast: false
          matrix:
            include: ${{ fromJSON(needs.determine-matrix.outputs.matrix) }}
        concurrency:
          group: ${{ github.head_ref }}-ubuntu-build-${{ matrix.java-version }}
          cancel-in-progress: true
        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v3

            -   name: Set up JDK ${{ matrix.java-version }}
                uses: actions/setup-java@v3
                with:
                    distribution: 'temurin'
                    java-version: ${{ matrix.java-version }}

            -   name: Override Ballerina Lang version
                if: ${{ matrix.lang-version != '' }}
                run: perl -pi -e "s/^\s*ballerinaLangVersion=.*/ballerinaLangVersion=${{ matrix.lang-version }}/" gradle.properties

            - name: Set ENV Variables
              run: |
                echo -e '${{ toJson(secrets) }}' | jq -r 'to_entries[] | .key + "=" + .value' >> $GITHUB_ENV

            -   name: Build the Package
                env:
                    packageUser: ${{ github.actor }}
                    packagePAT: ${{ secrets.GITHUB_TOKEN }}
                run: |
                  ./gradlew build -x test ${{ inputs.additional-ubuntu-build-flags }}
                  ./gradlew test ${{ inputs.additional-ubuntu-test-flags }}

            - name: Generate CodeCov Report
              if: ${{ matrix.report-coverage }}
              uses: codecov/codecov-action@v5
              with:
                token: ${{ secrets.CODECOV_TOKEN }}
                slug: ballerina-platform/${{ github.event.repository.name }}

    windows-build:
        name: Build on Windows
        needs: determine-matrix
        runs-on: windows-latest
        strategy:
          fail-fast: false
          matrix:
            include: ${{ fromJSON(needs.determine-matrix.outputs.matrix) }}
        concurrency:
          group: ${{ github.head_ref }}-windows-build-${{ matrix.java-version }}
          cancel-in-progress: true
        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v3

            -   name: Set up JDK ${{ matrix.java-version }}
                uses: actions/setup-java@v3
                with:
                    distribution: 'temurin'
                    java-version: ${{ matrix.java-version }}

            -   name: Override Ballerina Lang version
                if: ${{ matrix.lang-version != '' }}
                run: perl -pi -e "s/^\s*ballerinaLangVersion=.*/ballerinaLangVersion=${{ matrix.lang-version }}/" gradle.properties

            - name: Set ENV Variables
              run: |
                echo '${{ toJson(secrets) }}' | jq -r 'to_entries[] | .key + "=" + .value' | Out-File -FilePath $env:GITHUB_ENV -Append

            -   name: Build the Project
                env:
                    packageUser: ${{ github.actor }}
                    packagePAT: ${{ secrets.GITHUB_TOKEN }}
                    JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
                run: |
                  ./gradlew.bat build -x test ${{ inputs.additional-windows-build-flags }}
                  ./gradlew.bat test ${{ inputs.additional-windows-test-flags }}
