# Deprecated: kept only so existing callers referencing trivy-scan-template.yml@main
# keep working. This forwards to security-scan-template.yml, which is now the source
# of truth. New callers should reference security-scan-template.yml directly instead.
# Remove this file once every caller has migrated to security-scan-template.yml.
name: Trivy

on:
  workflow_call:
    inputs:
      additional-build-flags:
        required: false
        type: string
        default: ""
      # Forwarded through so an existing caller with a non-standard layout (no
      # top-level ballerina/ package, e.g. json-schema-tools, asyncapi-tools) can still
      # override them here -- without these, such a caller has no way to avoid
      # security-scan-template.yml's "No Ballerina packages found to scan" failure.
      scan-path:
        required: false
        type: string
        default: "ballerina"
      additional-scan-paths:
        required: false
        type: string
        default: ""

jobs:
  forward:
    uses: ./.github/workflows/security-scan-template.yml
    secrets: inherit
    with:
      additional-build-flags: ${{ inputs.additional-build-flags }}
      scan-path: ${{ inputs.scan-path }}
      additional-scan-paths: ${{ inputs.additional-scan-paths }}
